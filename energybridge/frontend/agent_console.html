<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EnergyBridge</title>
  <style>
    :root {
      --ink: #1f2933;
      --muted: #667085;
      --line: #d8dee7;
      --paper: #f7f3ea;
      --panel: #ffffff;
      --leaf: #25705a;
      --clay: #b5533c;
      --sky: #2e6f9e;
      --gold: #be8a22;
      --shadow: 0 18px 45px rgba(31, 41, 51, .12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(37,112,90,.09), transparent 34%),
        linear-gradient(315deg, rgba(190,138,34,.13), transparent 40%),
        var(--paper);
      font-family: ui-sans-serif, "Avenir Next", "Segoe UI", "Noto Sans SC", sans-serif;
    }
    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 320px 1fr;
      transition: grid-template-columns .2s ease;
    }
    .shell.sidebar-collapsed { grid-template-columns: 0 1fr; }
    aside {
      border-right: 1px solid var(--line);
      background: rgba(255,255,255,.72);
      backdrop-filter: blur(14px);
      padding: 24px 18px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
      transition: opacity .15s ease, padding .2s ease;
      z-index: 3;
    }
    .shell.sidebar-collapsed aside {
      opacity: 0;
      pointer-events: none;
      padding-left: 0;
      padding-right: 0;
    }
    main { padding: 26px; overflow: hidden; }
    h1 { font-size: 26px; line-height: 1.1; margin: 0 0 8px; letter-spacing: 0; }
    h2 { font-size: 18px; margin: 0 0 12px; }
    h3 { font-size: 15px; margin: 0 0 10px; color: var(--muted); font-weight: 700; }
    .sub { color: var(--muted); font-size: 13px; line-height: 1.5; margin-bottom: 20px; }
    select, textarea, input, button {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 10px 11px;
      background: #fff;
      color: var(--ink);
      font: inherit;
    }
    button {
      cursor: pointer;
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
      font-weight: 700;
    }
    button.secondary { background: #fff; color: var(--ink); }
    .sidebar-toggle {
      position: fixed;
      left: 14px;
      bottom: 14px;
      z-index: 5;
      width: auto;
      border-radius: 999px;
      padding: 10px 14px;
      box-shadow: var(--shadow);
    }
    .run-list { display: grid; gap: 8px; margin-top: 14px; }
    .run-btn {
      text-align: left;
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--line);
      font-weight: 650;
    }
    .run-btn.active { border-color: var(--leaf); box-shadow: inset 4px 0 0 var(--leaf); }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 18px;
      margin-bottom: 18px;
    }
    .title-block { max-width: 860px; }
    .brand-title { font-size: 44px; letter-spacing: -1px; }
    .result-name {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      margin: 2px 0 14px;
      color: var(--muted);
      font-weight: 750;
      overflow-wrap: anywhere;
    }
    .result-name strong { color: var(--ink); }
    .pill-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .pill {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.82);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 13px;
      color: var(--muted);
    }
    .grid { display: grid; gap: 16px; }
    .metrics { grid-template-columns: repeat(4, minmax(140px, 1fr)); }
    .panel {
      background: rgba(255,255,255,.88);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 16px;
    }
    .metric .label { color: var(--muted); font-size: 12px; }
    .metric .value { font-size: 26px; font-weight: 800; margin-top: 6px; }
    .event-layout { grid-template-columns: 1fr; align-items: start; }
    .events { display: grid; gap: 14px; }
    .event {
      border-left: 5px solid var(--sky);
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .event:hover { transform: translateY(-1px); }
    .event-head { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .score { font-size: 28px; font-weight: 850; color: var(--leaf); }
    .kv {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin: 12px 0;
    }
    .kv div { padding: 10px; background: #f8faf9; border: 1px solid #edf0f2; border-radius: 7px; }
    .kv span { display: block; color: var(--muted); font-size: 12px; margin-bottom: 4px; }
    .timeline { display: grid; gap: 8px; margin-top: 10px; }
    .decision {
      display: grid;
      grid-template-columns: 72px 86px 1fr;
      gap: 10px;
      align-items: start;
      padding: 9px 0;
      border-top: 1px solid #eef1f3;
      font-size: 13px;
    }
    .actions { color: var(--muted); overflow-wrap: anywhere; }
    .command-row { display: grid; grid-template-columns: 1fr 120px; gap: 10px; }
    .preset-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 0 0 10px; }
    .preset-grid button { padding: 9px; }
    .field-row { margin: 0 0 12px; }
    .field-row label { display: block; color: var(--muted); font-size: 12px; font-weight: 800; margin-bottom: 6px; }
    .inline-fields { display: grid; grid-template-columns: 120px 1fr; gap: 8px; }
    .live-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 10px 0; }
    .live-card { background: #f8faf9; border: 1px solid #edf0f2; border-radius: 7px; padding: 9px; }
    .live-card span { display: block; color: var(--muted); font-size: 11px; margin-bottom: 3px; }
    .live-card strong {
      display: block;
      min-width: 0;
      font-size: 16px;
      line-height: 1.35;
      white-space: normal;
      overflow-wrap: anywhere;
    }
    .dialogue-feed {
      max-height: 220px;
      overflow: auto;
      display: grid;
      gap: 8px;
      background: #f8faf9;
      border: 1px solid #edf0f2;
      border-radius: 7px;
      padding: 10px;
      margin-top: 10px;
    }
    .dialogue-item {
      padding: 8px 10px;
      border-radius: 7px;
      background: #fff;
      border-left: 4px solid var(--sky);
      line-height: 1.45;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .dialogue-item.user { border-left-color: var(--clay); }
    .dialogue-item.grid { border-left-color: var(--gold); }
    .dialogue-item.result { border-left-color: var(--leaf); }
    .dialogue-item small { display: block; color: var(--muted); margin-bottom: 3px; font-weight: 700; }
    .progress-viz {
      display: grid;
      grid-template-columns: repeat(3, minmax(220px, 1fr));
      gap: 12px;
      margin-top: 10px;
    }
    .progress-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      border-top: 4px solid var(--sky);
      min-height: 170px;
      min-width: 0;
    }
    .progress-card.active { border-top-color: var(--gold); box-shadow: 0 10px 24px rgba(190, 138, 34, .15); }
    .progress-card.done { border-top-color: var(--leaf); }
    .progress-card h4 { margin: 0 0 8px; font-size: 15px; }
    .progress-row {
      display: grid;
      grid-template-columns: 88px minmax(0, 1fr);
      gap: 8px;
      align-items: start;
      padding: 5px 0;
      border-top: 1px solid #eef1f3;
      font-size: 12px;
    }
    .progress-row span { color: var(--muted); }
    .progress-row strong {
      min-width: 0;
      line-height: 1.42;
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .progress-log { margin-top: 8px; display: grid; gap: 5px; }
    .progress-chip {
      min-width: 0;
      font-size: 12px;
      line-height: 1.45;
      border-radius: 12px;
      padding: 7px 9px;
      background: #f8faf9;
      border: 1px solid #edf0f2;
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .progress-section { margin-top: 10px; }
    .progress-section strong { display: block; font-size: 12px; margin-bottom: 5px; color: var(--muted); }
    .appliance-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
    .appliance-pill { font-size: 12px; border-radius: 7px; padding: 6px 8px; background: #fffdf8; border: 1px solid #eee2c9; overflow-wrap: anywhere; word-break: break-word; }
    .terminal {
      height: 260px;
      overflow: auto;
      background: #101820;
      color: #d9f0e3;
      border-radius: 7px;
      padding: 12px;
      font: 12px/1.45 ui-monospace, "SFMono-Regular", Consolas, monospace;
      white-space: pre-wrap;
    }
    .summary-log {
      max-height: 520px;
      overflow: auto;
      background: #fffdf8;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 12px;
      margin-top: 10px;
      white-space: pre-wrap;
      font: 12px/1.55 ui-monospace, "SFMono-Regular", Consolas, monospace;
    }
    .human-dialogue {
      background: #fffdf8;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
    }
    .human-custom { display: grid; grid-template-columns: 1fr 110px; gap: 10px; }
    .empty { padding: 40px; text-align: center; color: var(--muted); }
    @media (max-width: 980px) {
      .shell { grid-template-columns: 1fr; }
      .shell.sidebar-collapsed { grid-template-columns: 1fr; }
      aside { position: relative; height: auto; }
      .metrics, .event-layout, .progress-viz { grid-template-columns: 1fr; }
    }
    /* Home Assistant inspired interaction shell: own implementation, HA-like control surface. */
    :root {
      --ha-primary: #03a9f4;
      --ha-primary-dark: #0288d1;
      --ha-accent: #ffb300;
      --ha-success: #43a047;
      --ha-warning: #f57c00;
      --ha-ink: #1f2937;
      --ha-muted: #667085;
      --ha-line: #dde3ea;
      --ha-bg: #f4f6f8;
      --ha-card: #ffffff;
      --ha-subtle: #f8fafc;
      --ha-shadow: 0 2px 8px rgba(15, 23, 42, .08);
      --ink: var(--ha-ink);
      --muted: var(--ha-muted);
      --line: var(--ha-line);
      --paper: var(--ha-bg);
      --panel: var(--ha-card);
      --leaf: var(--ha-success);
      --clay: #d84315;
      --sky: var(--ha-primary);
      --gold: var(--ha-accent);
      --shadow: var(--ha-shadow);
    }
    body {
      background: var(--ha-bg);
      font-family: "Inter", "Roboto", "Segoe UI", "Noto Sans SC", ui-sans-serif, sans-serif;
    }
    .shell { grid-template-columns: 300px 1fr; }
    aside {
      background: var(--ha-card);
      border-right: 1px solid var(--ha-line);
      padding: 18px;
      box-shadow: none;
      backdrop-filter: none;
    }
    main {
      padding: 22px;
      max-width: 1440px;
      width: 100%;
    }
    .ha-brand {
      display: grid;
      grid-template-columns: 42px 1fr;
      gap: 12px;
      align-items: center;
      margin-bottom: 18px;
    }
    .ha-logo {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--ha-primary);
      color: #fff;
      font-weight: 850;
      box-shadow: 0 4px 10px rgba(3, 169, 244, .28);
    }
    aside h1 {
      font-size: 18px;
      margin: 0;
    }
    aside .sub {
      margin: 3px 0 0;
      font-size: 12px;
    }
    aside label {
      display: block;
      color: var(--ha-muted);
      font-size: 12px;
      font-weight: 800;
      margin: 14px 0 6px;
    }
    .side-nav {
      display: grid;
      gap: 7px;
      margin: 14px 0 4px;
      padding: 10px 0;
      border-top: 1px solid var(--ha-line);
      border-bottom: 1px solid var(--ha-line);
    }
    .nav-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 9px;
      border: 0;
      border-radius: 7px;
      padding: 10px;
      background: transparent;
      color: var(--ha-ink);
      box-shadow: none;
      text-align: left;
      font-weight: 750;
    }
    .nav-item.active {
      background: rgba(3, 169, 244, .12);
      color: var(--ha-primary-dark);
    }
    .nav-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--ha-primary);
      flex: 0 0 auto;
    }
    button {
      background: var(--ha-primary);
      border-color: var(--ha-primary);
      border-radius: 7px;
      box-shadow: none;
    }
    button:hover { background: var(--ha-primary-dark); border-color: var(--ha-primary-dark); }
    button.secondary {
      background: #fff;
      color: var(--ha-primary-dark);
      border-color: var(--ha-line);
    }
    button.secondary:hover {
      background: rgba(3, 169, 244, .08);
      border-color: rgba(3, 169, 244, .36);
    }
    select, textarea, input {
      border-radius: 7px;
      background: #fff;
    }
    select:focus, textarea:focus, input:focus {
      outline: 2px solid rgba(3, 169, 244, .22);
      border-color: var(--ha-primary);
    }
    .sidebar-toggle {
      background: var(--ha-card);
      color: var(--ha-primary-dark);
      border: 1px solid var(--ha-line);
      box-shadow: var(--ha-shadow);
    }
    .panel {
      background: var(--ha-card);
      border: 1px solid var(--ha-line);
      border-radius: 8px;
      box-shadow: var(--ha-shadow);
    }
    .brand-title {
      font-size: 32px;
      letter-spacing: 0;
      margin-bottom: 4px;
    }
    .title-block .sub { margin-bottom: 0; }
    .control-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .control-grid .field-row { margin-bottom: 0; }
    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 18px 0 10px;
    }
    .section-title h3 { margin: 0; color: var(--ha-ink); }
    .preset-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .live-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .live-card, .kv div {
      background: var(--ha-subtle);
      border-color: var(--ha-line);
    }
    .progress-card {
      border-radius: 8px;
      box-shadow: none;
    }
    .dialogue-feed, .summary-log, .human-dialogue {
      background: var(--ha-subtle);
      border-color: var(--ha-line);
    }
    .terminal {
      background: #0f172a;
      color: #dbeafe;
      border: 1px solid #1e293b;
    }
    .run-btn.active {
      border-color: rgba(3, 169, 244, .36);
      box-shadow: inset 4px 0 0 var(--ha-primary);
    }
    .event { border-left-color: var(--ha-primary); }
    .score { color: var(--ha-primary-dark); }
    .ha-dashboard-grid {
      display: grid;
      grid-template-columns: minmax(430px, 1fr) minmax(380px, 1fr) minmax(330px, .82fr);
      gap: 10px;
      align-items: stretch;
      min-height: min(760px, calc(100vh - 150px));
    }
    .ha-stack {
      display: grid;
      gap: 10px;
      align-content: stretch;
      height: 100%;
      min-height: 0;
    }
    .energy-stack { grid-template-rows: auto minmax(0, 1fr); }
    .device-stack { grid-template-rows: minmax(330px, .95fr) minmax(300px, 1fr); }
    .explain-stack { grid-template-rows: minmax(0, 1fr); }
    .energy-stack .tariff-card { grid-template-rows: auto auto auto minmax(0, 1fr) auto; }
    .device-stack > .ha-card:first-child {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }
    .device-stack > .ha-card:nth-child(2) {
      display: grid;
      grid-template-rows: auto auto auto minmax(0, 1fr);
    }
    .ha-card {
      background: var(--ha-card);
      border: 1px solid var(--ha-line);
      border-radius: 8px;
      box-shadow: var(--ha-shadow);
      padding: 10px;
      min-width: 0;
      min-height: 0;
    }
    .ha-card h3 {
      margin: 0 0 8px;
      color: var(--ha-ink);
      font-size: 16px;
    }
    .entity-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .entity-card {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      min-height: 72px;
      border: 1px solid var(--ha-line);
      border-radius: 8px;
      background: #fff;
      padding: 10px;
    }
    .entity-card.active { border-color: rgba(3, 169, 244, .34); background: rgba(3, 169, 244, .06); }
    .entity-card.warning { border-color: rgba(245, 124, 0, .32); background: rgba(245, 124, 0, .06); }
    .entity-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #eef2f7;
      color: var(--ha-muted);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0;
    }
    .entity-card.active .entity-icon { background: rgba(3, 169, 244, .16); color: var(--ha-primary-dark); }
    .entity-card.warning .entity-icon { background: rgba(245, 124, 0, .18); color: var(--ha-warning); }
    .entity-name {
      font-weight: 800;
      overflow-wrap: anywhere;
    }
    .entity-state {
      color: var(--ha-muted);
      font-size: 13px;
      line-height: 1.35;
      margin-top: 2px;
      overflow-wrap: anywhere;
    }
    .entity-meter {
      grid-column: 1 / -1;
      height: 7px;
      border-radius: 999px;
      background: #e8edf3;
      overflow: hidden;
      margin-top: 7px;
    }
    .entity-meter span {
      display: block;
      height: 100%;
      width: var(--value, 0%);
      background: var(--ha-primary);
      border-radius: inherit;
    }
    .strategy-summary {
      display: grid;
      gap: 6px;
    }
    .strategy-line {
      display: grid;
      grid-template-columns: 82px minmax(0, 1fr);
      gap: 8px;
      border-top: 1px solid var(--ha-line);
      padding-top: 6px;
      font-size: 12px;
    }
    .strategy-line:first-child { border-top: 0; padding-top: 0; }
    .strategy-line span {
      color: var(--ha-muted);
      font-weight: 800;
    }
    .strategy-line strong {
      line-height: 1.25;
      overflow-wrap: anywhere;
    }
    .energy-card {
      display: grid;
      gap: 12px;
    }
    .vpp-interaction-card {
      display: grid;
      gap: 12px;
    }
    .vpp-process {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      position: relative;
    }
    .process-step {
      border: 1px solid var(--ha-line);
      border-radius: 8px;
      background: #fff;
      min-height: 98px;
      padding: 10px;
      display: grid;
      gap: 7px;
      align-content: start;
      position: relative;
      z-index: 1;
    }
    .process-step.active {
      border-color: rgba(3, 169, 244, .36);
      background: rgba(3, 169, 244, .06);
    }
    .process-step.recommended {
      border-color: rgba(67, 160, 71, .36);
      background: rgba(67, 160, 71, .08);
    }
    .step-node {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--ha-primary);
      color: #fff;
      font-size: 13px;
      font-weight: 900;
    }
    .process-step.recommended .step-node { background: var(--ha-success); }
    .step-label {
      color: var(--ha-muted);
      font-size: 11px;
      font-weight: 850;
      text-transform: uppercase;
    }
    .step-value {
      color: var(--ha-ink);
      font-size: 13px;
      font-weight: 850;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }
    .capacity-options {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .capacity-card {
      border: 1px solid var(--ha-line);
      border-radius: 8px;
      background: #fff;
      padding: 10px;
      min-height: 112px;
      display: grid;
      gap: 6px;
      align-content: start;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.3);
    }
    .capacity-card.recommended {
      border-color: rgba(3, 169, 244, .48);
      background: linear-gradient(180deg, rgba(3, 169, 244, .09), #fff);
      box-shadow: inset 0 4px 0 var(--ha-primary);
    }
    .selected-capacity-report {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
      padding: 18px 20px;
      border: 1px solid rgba(67, 160, 71, .38);
      border-radius: 8px;
      background: rgba(67, 160, 71, .08);
      margin-bottom: 14px;
    }
    .selected-capacity-report span {
      display: block;
      color: var(--ha-muted);
      font-weight: 850;
      margin-bottom: 7px;
    }
    .selected-capacity-report strong {
      display: block;
      color: var(--ha-ink);
      font-size: 24px;
      line-height: 1.2;
    }
    .capacity-label {
      color: var(--ha-muted);
      font-size: 12px;

<body>
  <button id="sidebarToggle" class="sidebar-toggle secondary">Hide history</button>
  <div class="shell" id="shell">
    <aside id="sidebar">
      <div class="ha-brand">
        <div class="ha-logo">EB</div>
        <div>
          <h1>EnergyBridge</h1>
          <div class="sub">Human-centered VPP Agent console</div>
        </div>
      </div>
      <button id="newRunButton">New run</button>
      <div class="side-nav">
        <button class="nav-item active" type="button"><span class="nav-dot"></span>Agent console</button>
        <button class="nav-item" type="button"><span class="nav-dot"></span>Historical runs</button>
      </div>
      <label for="dateSelect">Date</label>
      <select id="dateSelect"></select>
      <label for="runSelect">Historical result</label>
      <select id="runSelect"></select>
    </aside>
    <main>
      <div id="app" class="empty">Loading benchmark results...</div>
    </main>
  </div>
  <script>
    const FULL_APPLIANCE_PERSONA_ID = 'all_appliances_full';
    const FULL_APPLIANCE_PERSONA_RUN_ID = 'basic_role_f_commuter_ev_optimizer';
    const FULL_APPLIANCE_PERSONA_PATH = 'energybridge/roleplay/personas/all_appliances_full.json';
    const state = {
      runs: [],
      personas: [],
      active: null,
      data: null,
      view: 'run',
      sidebarOpen: true,
      eventId: 'vpp1',
      jobId: null,
      jobPoll: null,
      selectedDate: '',
      selectedMethod: 'EnergyBridge',
      selectedPersona: FULL_APPLIANCE_PERSONA_ID,
      selectedCity: 'Tianjin',
      selectedDays: 3,
      selectedDay: 1,
      startDate: '',
      priceCsv: '',
      priceCsvManual: false,
      vppStartHour: 18,
      vppDurationHours: 1,
      vppEventsJson: '',
      userMode: 'roleplay',
      humanName: 'human_user',
      agentEdits: {}
    };
    const $ = (id) => document.getElementById(id);
    const fmt = (n, d=2) => Number.isFinite(Number(n)) ? Number(n).toFixed(d) : 'N/A';
    const esc = value => String(value ?? '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;');
    const pct = (n) => Number.isFinite(Number(n)) ? `${(Number(n)*100).toFixed(0)}%` : 'N/A';
    const DAY_OPTIONS = [
      {value: 3, label: '3day'},
      {value: 7, label: '7day'}
    ];
    const START_DATE_OPTIONS = [
      {value: '', label: 'Default date'},
      {value: '2025-06-01', label: '2025-06-01'}
    ];
    const PRICE_CSV_DEFAULTS = {
      Tianjin: 'experiments/real_data/tianjin_tou_price_normalized.csv',
      Germany: 'experiments/real_data/germany_2025_price.csv'
    };
    const DEFAULT_CAPACITY_MEMORY_JSON = 'dr_capacity_memory_toolkit/june_2025_daily_eb_rule_milp/data/eb_rule_milp_daily_dr_memory.json';

    async function api(path, opts) {
      const res = await fetch(path, opts);
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }

    async function loadRuns() {
      state.runs = await api('/api/runs');
      const dates = [...new Set(state.runs.map(r => r.date).filter(Boolean))].sort().reverse();
      if (!state.selectedDate || !dates.includes(state.selectedDate)) {
        state.selectedDate = dates[0] || '';
      }
      renderHistorySelectors();
      render();
    }

    async function loadPersonas() {
      state.personas = await api('/api/personas');
      const preferred = state.personas.find(p => p.id === FULL_APPLIANCE_PERSONA_ID);
      if (!state.personas.some(p => p.id === state.selectedPersona)) {
        state.selectedPersona = preferred?.id || state.personas[0]?.id || FULL_APPLIANCE_PERSONA_ID;
      }
    }

    function renderHistorySelectors() {
      const dates = [...new Set(state.runs.map(r => r.date).filter(Boolean))].sort().reverse();
      const dateSelect = $('dateSelect');
      if (dateSelect) {
        dateSelect.innerHTML = dates.length
          ? dates.map(date => `<option value="${date}" ${state.selectedDate === date ? 'selected' : ''}>${date}</option>`).join('')
          : '<option value="">No results</option>';
        dateSelect.onchange = () => {
          state.selectedDate = dateSelect.value;
          state.active = null;
          renderHistorySelectors();
        };
      }
      const runs = state.runs.filter(r => r.date === state.selectedDate);
      const runSelect = $('runSelect');
      if (runSelect) {
        runSelect.innerHTML = '<option value="">Select result...</option>' + runs.map(r => {
          const status = r.has_result ? '' : 'incomplete · ';
          return `<option value="${r.id}" ${state.active === r.id ? 'selected' : ''}>${status}${r.label}</option>`;
        }).join('');
        runSelect.onchange = () => loadRun(runSelect.value);
      }
    }

    async function loadRun(id) {
      if (!id) return;
      state.view = 'history';
      state.active = id;
      state.data = await api(`/api/run?id=${encodeURIComponent(id)}`);
      state.eventId = (state.data.vpp_event_log?.[0]?.id) || 'vpp1';
      $('runSelect').value = id;
      renderHistorySelectors();
      render();
    }

    function clockHour(value) {
      const raw = Number(value || 0);
      let hour = ((raw % 24) + 24) % 24;
      let hh = Math.floor(hour);
      let mm = Math.round((hour - hh) * 60);
      if (mm >= 60) {
        hh = (hh + 1) % 24;
        mm = 0;
      }
      return `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
    }

    function eventTitle(ev, index) {
      const day = index + 1;
      const start = ev.trigger_h !== undefined ? ev.trigger_h : 18 + index * 24;
      const end = ev.end_h !== undefined ? ev.end_h : 19 + index * 24;
      return `${ev.id || `vpp${day}`} · Day ${ev.day || day} ${clockHour(start)}-${clockHour(end)}`;
    }

    function actionsLine(actions) {
      const entries = Object.entries(actions || {}).filter(([, v]) => v !== null && v !== undefined);
      if (!entries.length) return 'keep current strategy';
      return entries.map(([k, v]) => `${k}=${v}`).join(' · ');
    }

    function slug(value) {
      return String(value || '').replace(/[^a-zA-Z0-9]+/g, '_').replace(/^_+|_+$/g, '').toLowerCase();
    }

    function personaRunLabel(personaId) {
      const match = String(personaId || '').match(/^basic_role_([a-z])(?:_|$)/);
      return match ? `role_${match[1]}` : (slug(personaId) || 'persona');
    }

    function methodRunToken(method) {
      if (method === 'agent' || String(method || '').toLowerCase() === 'energybridge') return 'EnergyBridge';
      return 'EnergyBridge';
    }

    function todayIso() {
      return new Date().toISOString().slice(0, 10);
    }

    function expectedRunName() {
      normalizeScenarioSelection();
      const personaForRunLabel = state.selectedPersona === FULL_APPLIANCE_PERSONA_ID
        ? FULL_APPLIANCE_PERSONA_RUN_ID
        : state.selectedPersona;
      const prefix = state.userMode === 'human'
        ? `${slug(state.humanName) || 'human'}_human`
        : personaRunLabel(personaForRunLabel);
      return `${todayIso()}/${prefix}_${methodRunToken(state.selectedMethod)}_${String(state.selectedCity || 'Tianjin').toLowerCase()}_${Number(state.selectedDays || 3)}days`;
    }

    function normalizeScenarioSelection() {
      const selectedDays = Number(state.selectedDays || 3);
      state.selectedDays = DAY_OPTIONS.some(item => item.value === selectedDays) ? selectedDays : 3;
      const allowedDates = START_DATE_OPTIONS.map(item => item.value);
      if (!allowedDates.includes(state.startDate)) state.startDate = '';
      normalizeDaySelection();
      syncDefaultPriceCsv();
    }

    function dayCountForData(resultData = null) {
      const eventCount = Array.isArray(resultData?.vpp_event_log) ? resultData.vpp_event_log.length : 0;
      return Math.max(1, eventCount || Number(state.selectedDays || 1));
    }

    function normalizeDaySelection(resultData = null) {
      const maxDay = dayCountForData(resultData);
      const day = Number(state.selectedDay || 1);
      state.selectedDay = Math.max(1, Math.min(maxDay, Number.isFinite(day) ? Math.floor(day) : 1));
      return state.selectedDay;
    }

    function dayOptionsHtml(resultData = null) {
      const count = dayCountForData(resultData);
      const selected = normalizeDaySelection(resultData);
      return Array.from({length: count}, (_, idx) => {
        const day = idx + 1;
        return `<option value="${day}" ${selected === day ? 'selected' : ''}>Day ${day}</option>`;
      }).join('');
    }

    function selectedVppEvent(resultData = null) {
      const events = Array.isArray(resultData?.vpp_event_log) ? resultData.vpp_event_log : [];
      if (!events.length) return null;
      const day = normalizeDaySelection(resultData);
      return events.find(ev => Number(ev?.day) === day) || events[day - 1] || events[0];
    }

    function selectedDayTraceRows(resultData = null) {
      const rows = Array.isArray(resultData?.daily_trace_rows)
        ? resultData.daily_trace_rows
        : (Array.isArray(resultData?.power_trace_rows) ? resultData.power_trace_rows : []);
      if (!rows.length) return [];
      const day = normalizeDaySelection(resultData);
      return rows
        .map(row => {
          const simH = numOrNull(row?.sim_h);
          const explicitDay = numOrNull(row?.day);
          const inferredDay = simH !== null ? Math.floor(simH / 24) + 1 : null;
          const hour = numOrNull(row?.hour)
            ?? numOrNull(row?.hod)
            ?? (simH !== null ? ((simH % 24) + 24) % 24 : null);
          return {...row, _day: explicitDay ?? inferredDay, _hour: hour};
        })
        .filter(row => Number(row._day) === day && row._hour !== null)
        .sort((a, b) => Number(a._hour) - Number(b._hour));
    }

    function selectedDayTemperature(resultData = null) {
      const trace = selectedDayTraceRows(resultData);
      const traced = trace
        .map(row => numOrNull(row?.indoor_temperature_c) ?? numOrNull(row?.room_temp_c) ?? numOrNull(row?.zone_temp_c))
        .filter(value => value !== null);
      if (traced.length) return traced[traced.length - 1];
      return null;
    }

    function selectedDayOutdoorTemperature(resultData = null) {
      const trace = selectedDayTraceRows(resultData);
      const traced = trace
        .map(row => numOrNull(row?.outdoor_temperature_c) ?? numOrNull(row?.outdoor_temp_c) ?? numOrNull(row?.weather_temp_c))
        .filter(value => value !== null);
      if (traced.length) return traced[traced.length - 1];
      return null;
    }

    function selectedDayTemperatureSeries(resultData = null) {
      const trace = selectedDayTraceRows(resultData);
      const traced = trace
        .map(row => ({
          hour: numOrNull(row?._hour),
          value: numOrNull(row?.indoor_temperature_c) ?? numOrNull(row?.room_temp_c) ?? numOrNull(row?.zone_temp_c)
        }))
        .filter(point => point.hour !== null && point.value !== null);
      if (traced.length) return traced;
      return [];
    }

    function selectedDaySetpointSeries(resultData = null) {
      const trace = selectedDayTraceRows(resultData);
      const traced = trace
        .map(row => ({
          hour: numOrNull(row?._hour),
          value: numOrNull(row?.ac_setpoint_c)
            ?? numOrNull(row?.setpoint_c)
            ?? numOrNull(row?.effective_setpoint)
        }))
        .filter(point => point.hour !== null && point.value !== null);
      if (traced.length) return traced;
      return [];
    }

    function selectedDayOutdoorTemperatureSeries(resultData = null) {
      const trace = selectedDayTraceRows(resultData);
      const traced = trace
        .map(row => ({
          hour: numOrNull(row?._hour),
          value: numOrNull(row?.outdoor_temperature_c) ?? numOrNull(row?.outdoor_temp_c) ?? numOrNull(row?.weather_temp_c)
        }))
        .filter(point => point.hour !== null && point.value !== null);
      if (traced.length) return traced;
      return [];
    }

    function selectedProgressItem(progress = [], resultData = null) {
      const items = Array.isArray(progress) ? progress : [];
      if (!items.length) return {};
      const day = normalizeDaySelection(resultData);
      return items.find(item => Number(item.day) === day || Number(item.key) === day) || items[day - 1] || items[items.length - 1] || {};
    }

    function defaultPriceCsvForCity(city) {
      return PRICE_CSV_DEFAULTS[String(city || '')] || '';
    }

    function syncDefaultPriceCsv(force = false) {
      if (!force && state.priceCsvManual) return;
      state.priceCsv = defaultPriceCsvForCity(state.selectedCity);
      state.priceCsvManual = false;
    }

    function runNameFromOutput(outputDir) {
      const raw = String(outputDir || '').replaceAll('\\\\', '/');
      const marker = '/benchmark_results/';
      if (raw.includes(marker)) return raw.split(marker).pop();
      const parts = raw.split('/').filter(Boolean);
      return parts.length >= 2 ? `${parts[parts.length - 2]}/${parts[parts.length - 1]}` : (raw || expectedRunName());
    }

    function appliancePlanFromActions(actions) {
      const plan = {};
      const a = actions || {};
      if (a.washer_skip) plan.washer = 'skipped';
      else if (a.washer_start_h !== undefined && a.washer_start_h !== null) plan.washer = `scheduled@${Number(a.washer_start_h).toFixed(1)}`;
      if (a.dishwasher_skip) plan.dishwasher = 'skipped';
      else if (a.dishwasher_start_h !== undefined && a.dishwasher_start_h !== null) plan.dishwasher = `scheduled@${Number(a.dishwasher_start_h).toFixed(1)}`;
      if (a.dryer_skip) plan.dryer = 'skipped';
      else if (a.dryer_start_h !== undefined && a.dryer_start_h !== null) plan.dryer = `scheduled@${Number(a.dryer_start_h).toFixed(1)}`;
      if (a.water_heater_preheat) {
        const start = a.water_heater_preheat_start_h ?? '?';
        const end = a.water_heater_preheat_end_h ?? '?';
        const temp = a.water_heater_preheat_temp_c ?? '?';
        plan.water_heater = `preheat ${start}-${end} @ ${temp}°C`;
      }
      if (a.ev_charge_start_h !== undefined && a.ev_charge_start_h !== null && a.ev_charge_end_h !== undefined && a.ev_charge_end_h !== null) {
        plan.ev = `charge ${Number(a.ev_charge_start_h).toFixed(1)}-${Number(a.ev_charge_end_h).toFixed(1)}`;
      } else if (a.ev_mode) {
        plan.ev = `mode ${a.ev_mode} only`;
      }
      return plan;
    }

    function actionObjectHasValues(actions) {
      return Object.values(actions || {}).some(value => value !== undefined && value !== null && value !== false && value !== '');
    }

    function deviceStateClass(text) {
      const value = String(text || '').toLowerCase();
      if (!value || value === 'waiting') return '';
      if (value.includes('skip') || value.includes('off') || value.includes('unavailable')) return 'warning';
      return 'active';
    }

    function collectAppliancePlan(progress = [], resultData = null) {
      const merged = {};
      for (const ev of progress || []) {
        const selectedDay = normalizeDaySelection(resultData);
        if (resultData && Number(ev.day || ev.key) !== selectedDay) continue;
        Object.entries(ev.appliances || {}).forEach(([key, value]) => {
          if (value && value !== 'waiting') merged[key] = value;
        });
      }
      const resultEvents = resultData?.vpp_event_log
        ? [selectedVppEvent(resultData)].filter(Boolean)
        : [];
      for (const ev of resultEvents) {
        const decisions = ev.day_decisions || [];
        const actionCandidates = [
          ev.vpp_trigger_actions,
          ...decisions.map(item => item.actions),
          ...decisions.map(item => item.raw_appliance_actions)
        ].filter(actionObjectHasValues);
        actionCandidates.forEach(actions => {
          Object.entries(appliancePlanFromActions(actions)).forEach(([key, value]) => {
            if (value) merged[key] = value;
          });
        });
      }
      return merged;
    }

    function latestProgressItem(progress = []) {
      return progress && progress.length ? progress[progress.length - 1] : {};
    }

    function isSolverTrace(text) {
      return /mpc_|solver|objective|total=|penalty|lambda|constraint|milp|cost=/i.test(String(text || ''));
    }

    function compactText(text) {
      return String(text || '').replace(/\s+/g, ' ').trim();
    }

    function conciseSentences(text, maxSentences = 4, maxChars = 560) {
      const compact = compactText(text);
      if (!compact) return '';
      const sentences = compact
        .split(/(?<=[.!?。！？])\s+/)
        .map(part => part.trim())
        .filter(Boolean);
      const shortened = sentences.length > maxSentences
        ? sentences.slice(0, maxSentences).join(' ')
        : compact;
      if (shortened.length <= maxChars) return shortened;
      const clipped = shortened.slice(0, maxChars).replace(/\s+\S*$/, '').trim();
      return clipped ? `${clipped}...` : shortened.slice(0, maxChars);
    }

    function isEnergyBridgeFacingExplanation(item = {}) {
      const speaker = compactText(item.speaker).toLowerCase();
      const audience = compactText(item.audience).toLowerCase();
      return speaker === 'energybridge'
        || audience.includes('customer')
        || audience.includes('household')
        || audience.includes('user')
        || Boolean(item.communication_goal)
        || Boolean(item.score_prompt_text)
        || Boolean(item.customer_explanation);
    }

    function customerExplanationFromItem(item = {}) {
      if (!item || typeof item !== 'object') return '';
      const preferred = [
        item.score_prompt_text,
        item.customer_explanation,
        item.energybridge_explanation,
        item.user_facing_explanation
      ].map(compactText).find(Boolean);
      if (preferred) return preferred;
      const natural = compactText(item.natural_language);
      if (natural && (compactText(item.speaker).toLowerCase() === 'energybridge' || /^EnergyBridge\b/i.test(natural))) {
        return natural;
      }
      return '';
    }

    function structuredStrategyExplanation(ev = null) {
      const candidates = [
        ev?.strategy_explanation,
        ev?.vpp_strategy_explanation,
        ev?.explanation,
        ev?.llm_raw_explanation,
        ev?.strategy_explanation?.llm_raw_explanation
      ].filter(item => item && typeof item === 'object' && Object.keys(item).length);
      for (const item of candidates) {
        const customerText = customerExplanationFromItem(item);
        if (customerText) return customerText;
        if (!isEnergyBridgeFacingExplanation(item)) continue;
        const parts = [
          item.why_request,
          ...(Array.isArray(item.recommended_actions)
            ? item.recommended_actions.map(action => {
                const device = action.device ? `${action.device}: ` : '';
                return compactText(`${device}${action.action || ''} ${action.duration || ''} ${action.rationale || ''}`);
              })
            : []),
          ...(Array.isArray(item.protected_constraints) ? item.protected_constraints : []),
          item.expected_benefit?.message
        ].map(compactText).filter(Boolean);
        if (parts.length) return parts.join('\n\n');
      }
      return '';
    }

    function humanStrategyExplanation({
      ev = null,
      appliances = {},
      setpoint = 'waiting',
      capacity = null,
      priceText = 'waiting',
      selectedStrategy = 'EnergyBridge Agent',
      fallbackReason = ''
    } = {}) {
      if (!ev) return '';
      const window = eventWindowText(ev ? {vpp_event_log: [ev]} : null).replace(/^D\d+\s+/, '');
      const vppWindow = window || 'the next VPP event';
      const applianceItems = Object.entries(appliances)
        .filter(([, value]) => value && value !== 'waiting')
        .slice(0, 4)
        .map(([key, value]) => `${key.replaceAll('_', ' ')} ${value}`);
      const capacityText = capacity?.recommendedKw !== null && capacity?.recommendedKw !== undefined
        ? `${fmt(capacity.recommendedKw, 2)} kW / ${capacityKwhText(capacity.recommendedEnergy)}`
        : 'the conservative available-capacity band';
      const reason = isSolverTrace(fallbackReason) ? '' : compactText(fallbackReason);
      const applianceSentence = applianceItems.length
        ? `Flexible appliances are scheduled around the event: ${applianceItems.join('; ')}.`
        : 'No flexible appliance is forced into the event window; the plan keeps routine service intact.';
      const priceSentence = priceText && priceText !== 'waiting'
        ? `The price signal is ${priceText}, so the plan avoids concentrating controllable load in the event window.`
        : 'The plan keeps the event window light while waiting for a confirmed market price signal.';
      return conciseSentences(
        `EnergyBridge recommends ${selectedStrategy} for ${vppWindow} and reports ${capacityText} before the VPP event. ` +
        `${applianceSentence} ${priceSentence} ` +
        `This keeps comfort and EV readiness protected while still offering the VPP a conservative flexible-capacity bid.` +
        (reason ? ` ${reason}` : ''),
        4
      );
    }

    function visualModel(progress = [], resultData = null, live = {}) {
      const latest = resultData ? selectedProgressItem(progress, resultData) : latestProgressItem(progress);
      const appliances = collectAppliancePlan(progress, resultData);
      const firstEvent = selectedVppEvent(resultData) || firstVppEvent(resultData);
      const notes = (latest.notes || []).filter(Boolean);
      const edit = state.agentEdits[agentEditKey(resultData)] || {};
      const setpointSeries = selectedDaySetpointSeries(resultData);
      const latestSetpoint = setpointSeries.length ? setpointSeries[setpointSeries.length - 1].value : null;
      const setpoint = latestSetpoint !== null && latestSetpoint !== undefined
        ? `${fmt(latestSetpoint, 1)}°C`
        : firstEvent?.setpoint !== undefined && firstEvent?.setpoint !== null
        ? `${fmt(firstEvent.setpoint, 1)}°C`
        : resultData?.agent_setpoint_c
          ? `${fmt(resultData.agent_setpoint_c, 1)}°C`
          : (latest.setpoint || live.sp || 'waiting');
      const score = firstEvent?.score !== undefined && firstEvent?.score !== null
        ? `${fmt(firstEvent.score, 0)}/5 ${firstEvent.label || ''}`.trim()
        : resultData?.user_pref_score
          ? `${fmt(resultData.user_pref_score, 1)}/5`
          : (latest.score || live.score || 'waiting');
      const selectedDay = normalizeDaySelection(resultData);
      const dailyEnergy = dailyTotalEnergyKwh(resultData, selectedDay);
      const totalEnergy = dailyEnergy !== null
        ? `${fmt(dailyEnergy, 1)} kWh`
        : resultData?.energy_kwh_total
          ? `${fmt(resultData.energy_kwh_total, 1)} kWh`
          : (live.energy || 'running');
      const eventEnergy = numOrNull(firstEvent?.actual_kwh);
      const selectedVppEnergy = eventEnergy !== null
        ? `${fmt(eventEnergy, 3)} kWh`
        : resultData?.vpp_window_energy_kwh
          ? `${fmt(resultData.vpp_window_energy_kwh, 3)} kWh`
          : (live.vpp || 'waiting');
      const roomTemperature = selectedDayTemperature(resultData);
      const temperature = roomTemperature !== null ? `${fmt(roomTemperature, 1)}°C` : 'waiting';
      const outdoorTemperatureRaw = selectedDayOutdoorTemperature(resultData);
      const outdoorTemperature = outdoorTemperatureRaw !== null ? `${fmt(outdoorTemperatureRaw, 1)}°C` : 'waiting';
      const target = firstEvent ? vppTargetText(firstEvent) : (latest.target || live.demand || 'waiting');
      const selectedStrategy = briefStrategyLabel(latest.selectedStrategy || 'waiting');
      const humanNote = [...notes].reverse().find(note => /human|feedback|input|score/i.test(note));
      const fallbackReason = firstEvent ? (notes.find(note => !/human|feedback|input|score/i.test(note)) || '') : '';
      const capacity = vppCapacityOptions({appliances}, resultData);
      const explanationBase = structuredStrategyExplanation(firstEvent)
        || humanStrategyExplanation({
          ev: firstEvent,
          appliances,
          setpoint,
          capacity,
          priceText: priceForecastText(resultData),
          selectedStrategy,
          fallbackReason
        });
      const userFeedbackBase = firstEvent?.comment
        || resultData?.user_pref_comment
        || humanNote
        || '';
      const explanation = edit.explanation ?? conciseSentences(explanationBase, 4);
      const userFeedback = edit.userFeedback ?? userFeedbackBase;
      return {appliances, setpoint, score, totalEnergy, vppEnergy: selectedVppEnergy, temperature, outdoorTemperature, target, selectedStrategy, explanation, userFeedback};
    }

    function briefStrategyLabel(value) {
      const text = String(value || '').trim();
      if (!text || text === 'waiting') return 'waiting';
      const bracket = text.match(/\[([A-Z])\]\s*([A-Za-z][A-Za-z ]*)/);
      if (bracket) {
        const label = bracket[2].split(/\s+[-–—;(|]/)[0].trim() || bracket[2].trim();
        const firstWord = label.split(/\s+/)[0] || label;
        return `[${bracket[1]}] ${firstWord}`;
      }
      const named = text.match(/\b(Balanced|Conservative|Aggressive|Comfort|Cost[- ]saving|EV[- ]safe)\b/i);
      if (named) return named[0].replace(/\b\w/g, c => c.toUpperCase());
      return text.length > 26 ? `${text.slice(0, 26).trim()}...` : text;
    }

    function applianceValue(model, key, fallback = 'waiting') {
      return model.appliances?.[key] || fallback;
    }

    function applianceScheduleItems(model) {
      const labels = {
        washer: 'Washer',
        dishwasher: 'Dishwasher',
        dryer: 'Dryer',
        water_heater: 'Water heater',
        ev: 'EV charger'
      };
      return Object.entries(labels)
        .map(([key, label]) => {
          const value = applianceValue(model, key, '');
          if (!value || value === 'waiting' || value === 'skipped') return null;
          return `${label}: ${value}`;
        })
        .filter(Boolean);
    }

    function agentEditKey(resultData = null) {
      const runKey = resultData?.run_dir || resultData?.run_path || state.active || state.jobId || 'live';
      const day = normalizeDaySelection(resultData);
      return `${runKey}::day${day}`;
    }

    function firstVppEvent(resultData = null) {
      return selectedVppEvent(resultData);
    }

    function numOrNull(value) {
      const n = Number(value);
      return Number.isFinite(n) ? n : null;
    }

    function positiveOrNull(value) {
      const n = numOrNull(value);
      return n !== null && n > 0 ? n : null;
    }

    function nonNegativeOrNull(value) {
      const n = numOrNull(value);
      return n !== null && n >= 0 ? n : null;
    }

    function eventWindowText(resultData = null) {
      const ev = selectedVppEvent(resultData) || firstVppEvent(resultData);
      const start = numOrNull(ev?.trigger_h) ?? Number(state.vppStartHour || 18);
      const duration = numOrNull(ev?.duration_hours) ?? Number(state.vppDurationHours || 1);
      const end = numOrNull(ev?.end_h) ?? (start + duration);
      const day = ev?.day ? `D${ev.day}` : 'next event';
      return `${day} ${clockHour(start)}-${clockHour(end)}`;
    }

    function priceForecastText(resultData = null) {
      const price = resultData?.day_ahead_price_metrics || {};
      const selectedDay = normalizeDaySelection(resultData);
      const perDay = (price.per_day || []).find(item => Number(item.day) === selectedDay) || {};
      if (price.available === false) return 'waiting';
      const weighted = numOrNull(perDay.weighted_price_eur_per_kwh) ?? numOrNull(price.weighted_price_eur_per_kwh);
      const cost = numOrNull(perDay.cost_eur) ?? numOrNull(price.total_cost_eur);
      if (weighted !== null) {
        const unit = price.price_unit || 'price/kWh';
        const costText = cost !== null ? `; total cost ${fmt(cost, 2)}` : '';
        return `${fmt(weighted, 3)} ${unit}${costText}`;
      }
      const profile = priceProfileForDay(resultData);
      const values = (profile?.prices || []).map(value => numOrNull(value)).filter(value => value !== null);
      if (values.length) {
        const avg = values.reduce((sum, value) => sum + value, 0) / values.length;
        return `${fmt(avg, 3)} ${price.price_unit || 'price/kWh'} avg`;
      }
      return 'waiting';
    }

    function dailyCostValue(resultData = null) {
      const price = resultData?.day_ahead_price_metrics || {};
      const selectedDay = normalizeDaySelection(resultData);
      const perDay = (price.per_day || []).find(item => Number(item.day) === selectedDay) || {};
      return numOrNull(perDay.cost_eur)
        ?? numOrNull(perDay.total_cost_eur)
        ?? numOrNull(perDay.cost)
        ?? numOrNull(price.total_cost_eur);
    }

    function dailyCostText(resultData = null) {
      const cost = dailyCostValue(resultData);
      if (cost === null) return 'waiting';
      const unit = resultData?.day_ahead_price_metrics?.cost_unit || '';
      return `${fmt(cost, 2)} ${unit}`.trim();
    }

    function selectedVppReductionKwh(resultData = null) {
      const ev = selectedVppEvent(resultData) || firstVppEvent(resultData);
      return nonNegativeOrNull(ev?.actual_shed_kwh)
        ?? nonNegativeOrNull(ev?.actual_reduction_kwh)
        ?? nonNegativeOrNull(ev?.measured_shed_kwh)
        ?? nonNegativeOrNull(ev?.event_baseline_estimate?.actual_shed_kwh)
        ?? nonNegativeOrNull(ev?.event_baseline_estimate?.actual_reduction_kwh)
        ?? nonNegativeOrNull(ev?.event_baseline_estimate?.measured_shed_kwh);
    }

    function reductionRatioValue(resultData = null) {
      const reduction = selectedVppReductionKwh(resultData);
      const reported = positiveOrNull(vppCapacityOptions({}, resultData).recommendedEnergy);
      if (reduction === null || reported === null) return null;
      return reduction / reported;
    }

    function reductionRatioText(resultData = null) {
      const ratio = reductionRatioValue(resultData);
      return ratio === null ? 'waiting' : `${fmt(ratio * 100, 0)}%`;
    }

    function selectedDayRuntimeMetrics(resultData = null) {
      const day = normalizeDaySelection(resultData);
      const rows = [
        ...(Array.isArray(resultData?.daily_llm_usage) ? resultData.daily_llm_usage : []),
        ...(Array.isArray(resultData?.day_llm_usage) ? resultData.day_llm_usage : []),
        ...(Array.isArray(resultData?.planning_metrics_per_day) ? resultData.planning_metrics_per_day : [])
      ];
      const row = rows.find(item => Number(item?.day) === day);
      if (!row) return {};
      const prompt = numOrNull(row.prompt_tokens) ?? 0;
      const completion = numOrNull(row.completion_tokens) ?? 0;
      const totalTokens = numOrNull(row.total_tokens) ?? (prompt + completion);
      const apiLatency = numOrNull(row.api_latency_s)
        ?? numOrNull(row.llm_latency_s)
        ?? numOrNull(row.latency_seconds);
      const planningElapsed = numOrNull(row.planning_elapsed_s)
        ?? numOrNull(row.planning_wall_s)
        ?? numOrNull(row.wall_time_s);
      const overhead = numOrNull(row.non_api_overhead_s)
        ?? numOrNull(row.recall_overhead_s)
        ?? numOrNull(row.retry_overhead_s)
        ?? (planningElapsed !== null && apiLatency !== null ? Math.max(0, planningElapsed - apiLatency) : null);
      return {totalTokens, apiLatency, planningElapsed, overhead, calls: numOrNull(row.llm_calls)};
    }

    function tokenText(value) {
      const n = numOrNull(value);
      return n === null || n <= 0 ? 'waiting' : `${fmt(n, 0)}`;
    }

    function secondsText(value) {
      const n = numOrNull(value);
      return n === null || n <= 0 ? 'waiting' : `${fmt(n, 1)}s`;
    }

    function renderPlanningMetrics(resultData = null) {
      const metrics = selectedDayRuntimeMetrics(resultData);
      const shownPlanTime = metrics.planningElapsed ?? metrics.apiLatency;
      return `
        <div class="planning-metrics">
          <div class="planning-stat"><span>Tokens</span><strong>${tokenText(metrics.totalTokens)}</strong></div>
          <div class="planning-stat"><span>Plan time</span><strong>${secondsText(shownPlanTime)}</strong></div>
          <div class="planning-stat"><span>API latency</span><strong>${secondsText(metrics.apiLatency)}</strong></div>
          <div class="planning-stat"><span>Recall / retry overhead</span><strong>${secondsText(metrics.overhead)}</strong></div>
        </div>`;
    }

    function quantileSuccessProbability(key) {
      const match = String(key || '').match(/p(\d+)/i);
      if (!match) return null;
      const q = Number(match[1]);
      if (!Number.isFinite(q)) return null;
      return Math.max(0, Math.min(100, 100 - q));
    }

    function vppCapacityReportText(model, resultData = null) {
      const capacity = vppCapacityOptions(model, resultData);
      const parts = [];
      if (capacity.recommendedKey) parts.push(capacity.recommendedKey.toUpperCase());
      if (capacity.recommendedEnergy !== null) parts.push(`${fmt(capacity.recommendedEnergy, 2)} kWh`);
      if (!parts.length) return 'waiting';
      return parts.join(' / ');
    }

    function flexibleLoadText(resultData = null) {
      const capacity = vppCapacityOptions({}, resultData);
      if (capacity.retrievalCount !== null) return `${fmt(capacity.retrievalCount, 0)} similar historical events`;
      return capacity.recommendedEnergy !== null ? `${fmt(capacity.recommendedEnergy, 2)} kWh reported option` : 'waiting';
    }

    function sparklinePoints(values, width = 350, height = 110, pad = 8) {
      const clean = values.map(v => Number(v)).filter(v => Number.isFinite(v));
      const min = Math.min(...clean, 0);
      const max = Math.max(...clean, 1);
      return values.map((value, idx) => {
        const x = pad + (idx / Math.max(1, values.length - 1)) * (width - pad * 2);
        const y = height - pad - ((Number(value) - min) / Math.max(0.001, max - min)) * (height - pad * 2);
        return `${fmt(x, 1)},${fmt(y, 1)}`;
      }).join(' ');
    }

    function priceProfileForDay(resultData = null) {
      const price = resultData?.day_ahead_price_metrics || {};
      const selectedDay = normalizeDaySelection(resultData);
      const perDay = (price.per_day || []).find(item => Number(item.day) === selectedDay) || {};
      const prices = Array.isArray(perDay.hourly_prices) ? perDay.hourly_prices.map(value => numOrNull(value)) : null;
      const labels = Array.isArray(perDay.hour_labels) ? perDay.hour_labels : null;
      if (prices && prices.some(value => value !== null)) {
        return {prices, labels};
      }
      return null;
    }

    function decisionObjectiveTerms(item) {
      return item?.objective_terms || item?.objective_terms_posthoc || {};
    }

    function decisionPredictedPowerKw(item) {
      const terms = decisionObjectiveTerms(item);
      const raw = terms?.cost?.raw || {};
      const dynamic = terms?.diagnostics?.dynamic_model_prediction || {};
      const direct = positiveOrNull(dynamic.predicted_total_power_kw)
        ?? positiveOrNull(raw.total_power_kw)
        ?? positiveOrNull(raw.home_power_kw)
        ?? positiveOrNull(raw.load_kw);
      if (direct !== null) return direct;
      const parts = [
        raw.hvac_power_kw,
        raw.shift_power_kw,
        raw.water_heater?.power_kw,
        raw.ev?.power_kw,
        raw.tasks?.washer?.power_kw,
        raw.tasks?.dishwasher?.power_kw,
        raw.tasks?.dryer?.power_kw
      ].map(numOrNull).filter(value => value !== null);
      if (!parts.length) return null;
      return parts.reduce((sum, value) => sum + value, 0);
    }

    function dashboardEnergySeries(resultData = null) {
      const ev = selectedVppEvent(resultData) || firstVppEvent(resultData);
      const start = Math.floor(numOrNull(ev?.trigger_h) ?? Number(state.vppStartHour || 18));
      const duration = Math.max(1, Math.ceil(numOrNull(ev?.duration_hours) ?? Number(state.vppDurationHours || 1)));
      const actualPriceProfile = priceProfileForDay(resultData);
      const actualPrices = Array.isArray(actualPriceProfile?.prices) ? actualPriceProfile.prices : [];
      const actualVppEnergy = selectedVppReductionKwh(resultData);
      const load = Array.from({length: 24}, () => null);
      const vpp = Array.from({length: 24}, () => null);
      const price = Array.from({length: 24}, (_, h) => numOrNull(actualPrices[h]));
      const trace = selectedDayTraceRows(resultData);
      if (trace.length) {
        const buckets = Array.from({length: 24}, () => []);
        trace.forEach(row => {
          const h = Math.max(0, Math.min(23, Math.floor(numOrNull(row?._hour) ?? -1)));
          const power = positiveOrNull(row?.power_kw);
          if (h >= 0 && power !== null) buckets[h].push(power);
        });
        buckets.forEach((values, h) => {
          if (values.length) load[h] = values.reduce((sum, value) => sum + value, 0) / values.length;
        });
      }
      for (let h = 0; h < 24; h += 1) {
        const inEvent = h >= start && h < start + duration;
        if (inEvent && actualVppEnergy !== null) vpp[h] = Math.max(0, actualVppEnergy / duration);
      }
      return {load, vpp, price};
    }

    function capacityKwText(value, fallback = 'waiting') {
      const n = numOrNull(value);
      return n === null ? fallback : `${fmt(n, 2)} kW`;
    }

    function capacityKwhText(value, fallback = 'waiting') {
      const n = numOrNull(value);
      return n === null ? fallback : `${fmt(n, 2)} kWh`;
    }

    function vppCapacityOptions(model, resultData = null) {
      const ev = selectedVppEvent(resultData) || firstVppEvent(resultData);
      const agentReport = ev?.agent_capacity_report || {};
      const agentOptions = agentReport?.vpp_capacity_options || {};
      const optionMap = agentOptions.options || agentOptions || {};
      const quantileKeys = ['p50', 'p70', 'p90'];
      const hasHistoricalOptions = quantileKeys.some(q => (
        numOrNull(optionMap[q]?.reported_capacity_kw) !== null
        || numOrNull(optionMap[q]?.reported_capacity_kwh) !== null
      ));
      if (hasHistoricalOptions) {
        const options = quantileKeys.map(q => ({
          key: q,
          label: q.toUpperCase(),
          value: numOrNull(optionMap[q]?.reported_capacity_kw),
          energy: numOrNull(optionMap[q]?.reported_capacity_kwh),
          detail: q === 'p50'
            ? 'comfort-first historical memory band'
            : q === 'p70'
              ? 'balanced historical memory band'
              : 'grid-cooperative historical memory band'
        }));
        const rawRecommendedKey = String(agentReport.recommended_quantile || agentReport.choice || '').toLowerCase();
        const recommendedKey = quantileKeys.includes(rawRecommendedKey)
          ? rawRecommendedKey
          : (options.find(option => option.value !== null || option.energy !== null)?.key || '');
        const selectedOption = recommendedKey ? optionMap[recommendedKey] : {};
        const successProbability = quantileSuccessProbability(recommendedKey);
        return {
          options,
          recommendedKey,
          recommendedKw: numOrNull(agentReport.reported_capacity_kw)
            ?? numOrNull(selectedOption?.reported_capacity_kw),
          recommendedEnergy: numOrNull(agentReport.reported_capacity_kwh)
            ?? numOrNull(selectedOption?.reported_capacity_kwh),
          success: successProbability,
          confidence: successProbability,
          memoryConfidence: numOrNull(agentReport.deterministic_memory_estimate?.confidence),
          retrievalCount: numOrNull(agentReport.deterministic_memory_estimate?.retrieval_count),
          basis: agentReport.basis || agentReport.capacity_bands?.basis || agentOptions.basis || '',
          reason: agentReport.reason || '',
          source: `${recommendedKey.toUpperCase()} from historical similar-event distribution`
        };
      }
      return {
        options: [],
        recommendedKey: '',
        recommendedKw: null,
        recommendedEnergy: null,
        success: null,
        confidence: null,
        memoryConfidence: null,
        retrievalCount: null,
        basis: '',
        reason: '',
        source: ''
      };
    }

    function renderVppInteraction(model, resultData = null) {
      const capacity = vppCapacityOptions(model, resultData);
      const ev = selectedVppEvent(resultData) || firstVppEvent(resultData);
      const confidenceText = capacity.confidence !== null ? `${fmt(capacity.confidence, 0)}%` : 'waiting';
      const quantileText = capacity.recommendedKey ? capacity.recommendedKey.toUpperCase() : 'waiting';
      const reportText = capacity.recommendedEnergy !== null
        ? capacityKwhText(capacity.recommendedEnergy)
        : 'missing agent capacity report';
      return `
        <div class="ha-card vpp-interaction-card">
          <h3>VPP interaction</h3>
          <div class="selected-capacity-report">
            <div>
              <span>Report to VPP</span>
              <strong>${reportText}</strong>
            </div>
            <div class="recommend-badge">${quantileText}</div>
          </div>
          <div class="forecast-table">
            <div class="forecast-row"><span>Event window</span><strong>${eventWindowText(resultData)}</strong></div>
            <div class="forecast-row"><span>Selected quantile</span><strong>${quantileText}</strong></div>
            <div class="forecast-row"><span>Historical samples</span><strong>${capacity.retrievalCount !== null ? fmt(capacity.retrievalCount, 0) : 'waiting'}</strong></div>
            <div class="forecast-row"><span>Confidence</span><strong>${confidenceText}</strong></div>
          </div>
        </div>`;
    }

    function tariffSeries(resultData = null) {
      const traces = dashboardEnergySeries(resultData);
      const ev = selectedVppEvent(resultData) || firstVppEvent(resultData);
      const start = Math.floor(numOrNull(ev?.trigger_h) ?? Number(state.vppStartHour || 18));
      const duration = Math.max(1, Math.ceil(numOrNull(ev?.duration_hours) ?? Number(state.vppDurationHours || 1)));
      return Array.from({length: 24}, (_, h) => {
        const event = h >= start && h < start + duration;
        const grid = numOrNull(traces.load[h]);
        const price = numOrNull(traces.price[h]);
        const vppEnergy = numOrNull(traces.vpp[h]);
        return {
          hour: h,
          grid,
          price,
          vpp: event && vppEnergy !== null ? -vppEnergy : null,
          event
        };
      });
    }

    function chartPolyline(values, width, height, pad, min, max) {
      return values.map((value, idx) => {
        const x = pad + (idx / Math.max(1, values.length - 1)) * (width - pad * 2);
        const y = height - pad - ((value - min) / Math.max(0.001, max - min)) * (height - pad * 2);
        return `${fmt(x, 1)},${fmt(y, 1)}`;
      }).join(' ');
    }

    function sparsePolyline(rows, valueKey, width, height, pad, min, max) {
      return rows
        .filter(row => numOrNull(row?.[valueKey]) !== null)
        .map(row => {
          const x = pad + (row.hour / 23) * (width - pad * 2);
          const y = height - pad - ((Number(row[valueKey]) - min) / Math.max(0.001, max - min)) * (height - pad * 2);
          return `${fmt(x, 1)},${fmt(y, 1)}`;
        })
        .join(' ');
    }

    function renderTemperatureTrend(resultData = null, setpointText = '') {
      const indoor = selectedDayTemperatureSeries(resultData)
        .map(point => ({hour: numOrNull(point?.hour), value: numOrNull(point?.value)}))
        .filter(point => point.hour !== null && point.value !== null);
      const outdoor = selectedDayOutdoorTemperatureSeries(resultData)
        .map(point => ({hour: numOrNull(point?.hour), value: numOrNull(point?.value)}))
        .filter(point => point.hour !== null && point.value !== null);
      const setpoints = selectedDaySetpointSeries(resultData)
        .map(point => ({hour: numOrNull(point?.hour), value: numOrNull(point?.value)}))
        .filter(point => point.hour !== null && point.value !== null);
      const width = 440;
      const height = 190;
      const padLeft = 42;
      const padRight = 18;
      const padTop = 18;
      const padBottom = 34;
      const plotW = width - padLeft - padRight;
      const plotH = height - padTop - padBottom;
      const cleanIndoor = indoor;
      const cleanOutdoor = outdoor.length ? outdoor : [];
      const cleanSetpoints = setpoints;
      const all = [...cleanIndoor, ...cleanOutdoor, ...cleanSetpoints].map(point => point.value);
      if (!all.length) {
        return `
          <div class="temperature-chart">
            <div class="empty-state">No temperature time series</div>
          </div>`;
      }
      const min = Math.floor(Math.min(...all) - 0.8);
      const max = Math.ceil(Math.max(...all) + 0.8);
      const yFor = value => padTop + (1 - ((value - min) / Math.max(0.001, max - min))) * plotH;
      const xForHour = hour => padLeft + (Math.max(0, Math.min(24, hour)) / 24) * plotW;
      const lineFor = points => points.map(point => `${fmt(xForHour(point.hour), 1)},${fmt(yFor(point.value), 1)}`).join(' ');
      const line = lineFor(cleanIndoor);
      const outdoorLine = cleanOutdoor.length ? lineFor(cleanOutdoor) : '';
      const setpointLine = cleanSetpoints.length ? lineFor(cleanSetpoints) : '';
      const lastIndoor = cleanIndoor.length ? cleanIndoor[cleanIndoor.length - 1] : null;
      const lastX = lastIndoor ? xForHour(lastIndoor.hour) : null;
      const lastY = lastIndoor ? yFor(lastIndoor.value) : null;
      const ticks = [max, (min + max) / 2, min];
      return `
        <div class="temperature-chart">
          <svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Room temperature trend">
            <rect class="temp-band" x="${padLeft}" y="${padTop}" width="${plotW}" height="${plotH}" rx="6" />
            ${ticks.map(tick => {
              const y = yFor(tick);
              return `
                <line class="chart-grid" x1="${padLeft}" y1="${fmt(y, 1)}" x2="${width - padRight}" y2="${fmt(y, 1)}" />
                <text class="temp-axis-label" x="${padLeft - 6}" y="${fmt(y + 3, 1)}" text-anchor="end">${fmt(tick, 0)}°C</text>`;
            }).join('')}
            ${[0, 6, 12, 18, 23].map(h => {
              const x = padLeft + h / 23 * plotW;
              return `
                <line class="chart-grid" x1="${fmt(x, 1)}" y1="${padTop}" x2="${fmt(x, 1)}" y2="${padTop + plotH}" />
                <text class="temp-axis-label" x="${fmt(x, 1)}" y="${height - 12}" text-anchor="middle">${h === 23 ? '24' : String(h).padStart(2, '0')}</text>`;
            }).join('')}
            ${setpointLine ? `<polyline class="temp-setpoint" points="${setpointLine}" fill="none" />` : ''}
            ${outdoorLine ? `<polyline class="temp-outdoor-line" points="${outdoorLine}" />` : ''}
            ${line ? `<polyline class="temp-line" points="${line}" />` : ''}
            ${lastX === null || lastY === null ? '' : `<circle class="temp-dot" cx="${fmt(lastX, 1)}" cy="${fmt(lastY, 1)}" r="4" />`}
          </svg>
          <div class="temp-legend">
            <span class="legend-item"><span class="legend-dot legend-room"></span>Room temp</span>
            <span class="legend-item"><span class="legend-dot legend-setpoint"></span>AC setpoint</span>
            <span class="legend-item"><span class="legend-dot legend-outdoor"></span>Outdoor temp</span>
          </div>
        </div>`;
    }

    function renderTariffBars(resultData = null) {
      const rows = tariffSeries(resultData);
      const width = 440;
      const height = 190;
      const pad = 28;
      const axisY = 132;
      const positiveValues = rows.map(r => r.grid).map(numOrNull).filter(value => value !== null);
      const negativeValues = rows.map(r => Math.abs(numOrNull(r.vpp) ?? 0)).filter(value => value > 0);
      const anyRealSeries = rows.some(r => (
        numOrNull(r.grid) !== null
        || numOrNull(r.price) !== null
        || numOrNull(r.vpp) !== null
      ));
      if (!anyRealSeries) {
        return `
          <div class="tariff-chart">
          <div class="empty-state">No hourly price, load, or actual VPP reduction series</div>
          </div>`;
      }
      const maxPos = Math.max(...positiveValues, 1);
      const maxNeg = Math.max(...negativeValues, 0.3);
      const barW = (width - pad * 2) / 24 * 0.58;
      const xFor = h => pad + h / 23 * (width - pad * 2);
      const yPos = value => axisY - (value / maxPos) * 94;
      const yNeg = value => axisY + (Math.abs(value) / maxNeg) * 38;
      const priceValues = rows.map(r => r.price).map(numOrNull).filter(value => value !== null);
      const priceMin = priceValues.length ? Math.min(...priceValues) : 0;
      const priceMax = priceValues.length ? Math.max(...priceValues) : 1;
      const eventStart = Math.min(...rows.filter(r => r.event).map(r => r.hour), Number(state.vppStartHour || 18));
      const eventEnd = Math.max(...rows.filter(r => r.event).map(r => r.hour + 1), eventStart + Number(state.vppDurationHours || 1));
      const eventX = xFor(Math.max(0, Math.min(23, eventStart)));
      const eventW = Math.max(10, (eventEnd - eventStart) / 24 * (width - pad * 2));
      const timeTicks = [0, 4, 8, 12, 16, 20, 23];
      return `
        <div class="tariff-chart">
          <svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Day-ahead price and load estimate">
            <rect class="event-band" x="${fmt(eventX, 1)}" y="18" width="${fmt(eventW, 1)}" height="${height - 48}" rx="4" />
            ${[46, 74, 102, axisY, 160].map(y => `<line class="chart-grid" x1="${pad}" y1="${y}" x2="${width - pad}" y2="${y}" />`).join('')}
            ${timeTicks.map(h => `<line class="chart-grid" x1="${fmt(xFor(h), 1)}" y1="18" x2="${fmt(xFor(h), 1)}" y2="${height - 28}" />`).join('')}
            <line class="chart-axis" x1="${pad}" y1="${axisY}" x2="${width - pad}" y2="${axisY}" />
            ${rows.map(r => {
              const x = xFor(r.hour) - barW / 2;
              const grid = numOrNull(r.grid);
              const vpp = numOrNull(r.vpp);
              const gy = grid === null ? null : yPos(grid);
              const vy = axisY;
              const vh = vpp === null ? 0 : Math.max(0, yNeg(vpp) - axisY);
              return `
                ${gy === null ? '' : `<rect class="bar-grid" x="${fmt(x, 1)}" y="${fmt(gy, 1)}" width="${fmt(barW, 1)}" height="${fmt(axisY - gy, 1)}" rx="3" />`}
                ${vh > 1 ? `<rect class="bar-vpp" x="${fmt(x, 1)}" y="${fmt(vy, 1)}" width="${fmt(barW, 1)}" height="${fmt(vh, 1)}" rx="3" />` : ''}`;
            }).join('')}
            ${priceValues.length >= 2 ? `<polyline class="chart-price-line" points="${sparsePolyline(rows, 'price', width, height, pad, priceMin, priceMax)}" />` : ''}
            <line class="event-line" x1="${fmt(eventX, 1)}" y1="18" x2="${fmt(eventX, 1)}" y2="${height - 28}" />
            <text x="${fmt(eventX + eventW / 2, 1)}" y="14" fill="#008bd2" font-size="10" text-anchor="middle">VPP ${clockHour(eventStart)}-${clockHour(eventEnd)}</text>
            ${timeTicks.map(h => `
              <text x="${fmt(xFor(h), 1)}" y="${height - 6}" fill="#667085" font-size="10" text-anchor="middle">${h === 23 ? '24:00' : `${String(h).padStart(2, '0')}:00`}</text>
            `).join('')}
            <text x="${width / 2}" y="${height - 20}" fill="#667085" font-size="11" text-anchor="middle">load / VPP / day-ahead price</text>
          </svg>
          <div class="tariff-legend">
            <span class="legend-item"><span class="legend-dot legend-grid"></span>Grid load</span>
            <span class="legend-item"><span class="legend-dot legend-vpp"></span>Actual VPP reduction</span>
            <span class="legend-item"><span class="legend-dot legend-price"></span>Day-ahead price</span>
          </div>
        </div>`;
    }

    function renderTariffDashboard(model, resultData = null) {
      const reduction = selectedVppReductionKwh(resultData);
      const schedule = applianceScheduleItems(model);
      return `
        <div class="ha-card tariff-card">

            <div class="forecast-row"><span>Actual VPP reduction</span><strong>${reduction !== null ? `${fmt(reduction, 2)} kWh` : 'waiting'}</strong></div>
